networks:
  space:

services:
  server:
    build: nginx/.
    ports:
      - 40001:80
    networks:
      - space
    depends_on:
      - repository
  repository:
    hostname: repository
    image: spacedsl-cs
    command: ["./SpaceDemo.Repository", "80", "+", "--non-interactive"]
    ports:
      - 40000:80
    networks:
      - space
  loader:
    image: spacedsl-cs
    command: ["./SpaceDemo.Loader", "/app/chunks/", "repository", "80"]
    # command: ["sleep", "10000000"]
    depends_on:
      - server
    networks:
      - space
  client1-react:
    image: spacedsl-react
    ports:
      - 1234:80
    networks:
      - space
  client2-daga:
    image: spacedsl-daga
    ports:
      - 1235:80
    networks:
      - space
